{% extends 'base.html' %}
{% block title %}Check Your Email{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card glass-card p-4 mt-5 text-center">
            <h4 class="mb-3">Check your inbox</h4>
            <p style="color: rgba(255,255,255,0.8);">
                If an account exists with that email, we've sent instructions to reset your password.
                Be sure to check your spam folder if it doesn't arrive shortly.
            </p>
            <a href="{% url 'index' %}" class="btn btn-primary mt-2">Back to Home</a>
        </div>
    </div>
</div>
{% endblock %}

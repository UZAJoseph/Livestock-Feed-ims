{% extends 'base.html' %}
{% block title %}Password Reset Complete{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card glass-card p-4 mt-5 text-center">
            <h4 class="mb-3">Password changed!</h4>
            <p style="color: rgba(255,255,255,0.8);">Your password has been reset successfully.</p>
            <a href="#" class="btn btn-primary mt-2" data-bs-toggle="modal" data-bs-target="#authModal">Log in now</a>
        </div>
    </div>
</div>
{% endblock %}

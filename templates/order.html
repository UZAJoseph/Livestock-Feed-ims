<div class="modal glass-modal" id="orderNow">
    <div class="modal-dialog">
        <div class="modal-content">
            <!-- Modal Header -->
            <div class="modal-header">
                <h4 class="modal-title">Order Page</h4>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <!-- Modal body -->
            <div class="modal-body">
                {% if messages %}
                {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                {% endfor %}
                {% endif %}

                <form method="post" action="{% url 'order_form' %}">
                    {% csrf_token %}

                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label">Animal</label>
                            <select id="id_animal" class="form-select" required>
                                <option value="">-- Select an animal --</option>
                            </select>
                        </div>
                        <div class="col-6">
                            <label class="form-label">Feed Type</label>
                            <select id="id_feed_type" class="form-select" required>
                                <option value="">-- Select feed type --</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Package</label>
                        <select name="product" id="id_product" class="form-select" required disabled>
                            <option value="">-- Select a package --</option>
                        </select>
                    </div>

                    <!-- source data for the cascade, hidden from the user -->
                    <select id="products-data" style="display:none">
                        {% for product in products %}
                        <option value="{{ product.id }}" data-animal-id="{{ product.feed_type.animal.id }}"
                            data-animal-name="{{ product.feed_type.animal.name }}"
                            data-feedtype-id="{{ product.feed_type.id }}"
                            data-feedtype-name="{{ product.feed_type.name }}" data-price="{{ product.default_price }}"
                            data-quantity="{{ product.stock_quantity }}" data-amount="{{ product.amount }}"
                            data-measure-name="{{ product.measure.name }}"
                            data-measure-abbr="{{ product.measure.abbreviation }}"
                            data-label="{{ product.store.name }} - {{ product.amount }}{{ product.measure.abbreviation }} - {{ product.default_price }} RWF">
                        </option>
                        {% endfor %}
                    </select>

                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label" id="unitPriceLabel">Unit Price</label>
                            <input type="text" id="id_unit_price" class="form-control" readonly>
                        </div>
                        <div class="col-6">
                            <label class="form-label" id="quantityLabel">Quantity</label>
                            <input type="number" step="0.01" min="0.01" name="quantity" id="id_quantity"
                                class="form-control" required>
                            <div class="form-text text-white-50" id="totalPhysicalHelper"></div>
                            <div id="stockAvailableText" class="form-text" style="color: rgba(255,255,255,0.6);"></div>
                            <div id="quantityError" class="form-text" style="display:none; color:#ff8a80;"></div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Total Price</label>
                        <input type="text" id="id_total_price" class="form-control" readonly>
                    </div>

                    <hr>
                    <p class="mb-2 text-center" style="color: rgba(255,255,255,0.6); font-size: 0.85rem;">
                        My Personal Information
                    </p>

                    <div class="row g-2 mb-2">
                        <div class="col-6">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" readonly
                                value="{{ request.user.first_name }} {{ request.user.last_name }}">
                        </div>
                        <div class="col-6">
                            <label class="form-label">Telephone</label>
                            <input type="text" class="form-control" readonly value="{{ profile.telephone|default:'' }}">
                        </div>
                    </div>

                    <div class="row g-2 mb-2">
                        <div class="col-6">
                            <label class="form-label">District</label>
                            <input type="text" class="form-control" readonly value="{{ profile.district|default:'' }}">
                        </div>
                        <div class="col-6">
                            <label class="form-label">Sector</label>
                            <input type="text" class="form-control" readonly value="{{ profile.sector|default:'' }}">
                        </div>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label">Cell</label>
                            <input type="text" class="form-control" readonly value="{{ profile.cell|default:'' }}">
                        </div>
                        <div class="col-6">
                            <label class="form-label">Village</label>
                            <input type="text" class="form-control" readonly value="{{ profile.village|default:'' }}">
                        </div>
                    </div>

                    <button type="submit" id="orderSubmitBtn" class="btn btn-success">Order Now</button>
                </form>
            </div>

            <style>
                .glass-modal .form-select option:disabled {
                    color: rgba(255, 120, 120, 0.65);
                    font-style: italic;
                }

                .glass-modal .modal-content {
                    background: rgba(255, 255, 255, 0.15);
                    backdrop-filter: blur(12px);
                    -webkit-backdrop-filter: blur(12px);
                    border: 1px solid rgba(255, 255, 255, 0.3);
                    color: white;
                    border-radius: 12px;
                }

                .glass-modal .modal-header,
                .glass-modal .modal-footer {
                    border-color: rgba(255, 255, 255, 0.2);
                }

                .glass-modal .form-control,
                .glass-modal .form-select {
                    background: rgba(255, 255, 255, 0.1);
                    border: 1px solid rgba(255, 255, 255, 0.3);
                    color: white;
                }

                .glass-modal .form-select option {
                    background-color: #2c3e50;
                    color: white;
                }

                .glass-modal .form-control::placeholder {
                    color: rgba(255, 255, 255, 0.6);
                }

                .glass-modal .form-control:focus,
                .glass-modal .form-select:focus {
                    background: rgba(255, 255, 255, 0.15);
                    border-color: rgba(255, 255, 255, 0.5);
                    color: white;
                    box-shadow: none;
                }

                .glass-modal .form-control[readonly] {
                    background: rgba(255, 255, 255, 0.08);
                    color: rgba(255, 255, 255, 0.85);
                }

                .glass-modal .form-control:disabled,
                .glass-modal .form-select:disabled {
                    background: rgba(255, 255, 255, 0.05);
                    color: rgba(255, 255, 255, 0.5);
                }

                .glass-modal .form-label {
                    color: white;
                }

                .glass-modal .btn-close {
                    filter: invert(1);
                }

                .glass-modal .alert {
                    background: rgba(255, 255, 255, 0.15);
                    border: 1px solid rgba(255, 255, 255, 0.3);
                    color: white;
                }

                .modal-backdrop.show {
                    opacity: 0.6;
                }
            </style>

            <script>
                function openOrderModal(animalId) {
                    console.log('Clicked animal ID:', animalId, typeof animalId);

                    const modalEl = document.getElementById('orderNow');
                    const modal = new bootstrap.Modal(modalEl);

                    modalEl.addEventListener('shown.bs.modal', function handler() {
                        const animalSelect = document.getElementById('id_animal');
                        console.log('Available options:', Array.from(animalSelect.options).map(o => o.value));
                        animalSelect.value = animalId;
                        console.log('Select value after setting:', animalSelect.value);
                        animalSelect.dispatchEvent(new Event('change'));
                        modalEl.removeEventListener('shown.bs.modal', handler);
                    });

                    modal.show();
                }
                document.getElementById('orderNow').addEventListener('hide.bs.modal', function () {
                    if (document.activeElement && this.contains(document.activeElement)) {
                        document.activeElement.blur();
                    }
                });
                document.addEventListener('DOMContentLoaded', function () {

                    const dataSelect = document.getElementById('products-data');
                    const productOptions = Array.from(dataSelect.options);

                    const animalSelect = document.getElementById('id_animal');
                    const feedTypeSelect = document.getElementById('id_feed_type');
                    const productSelect = document.getElementById('id_product');

                    const quantityInput = document.getElementById('id_quantity');
                    const unitPriceField = document.getElementById('id_unit_price');
                    const totalPriceField = document.getElementById('id_total_price');


                    // -------------------------
                    // Load animals
                    // -------------------------
                    const animals = [];

                    productOptions.forEach(product => {
                        const animalId = product.dataset.animalId;
                        const animalName = product.dataset.animalName;

                        if (!animals.find(a => a.id === animalId)) {
                            animals.push({
                                id: animalId,
                                name: animalName
                            });
                        }
                    });


                    animals.forEach(animal => {
                        const option = document.createElement('option');
                        option.value = animal.id;
                        option.textContent = animal.name;
                        animalSelect.appendChild(option);
                    });


                    // -------------------------
                    // Animal changed
                    // -------------------------
                    animalSelect.addEventListener('change', function () {
                        const animalId = this.value;

                        feedTypeSelect.innerHTML = '<option value="">-- Select feed type --</option>';
                        productSelect.innerHTML = '<option value="">-- Select a package --</option>';
                        feedTypeSelect.disabled = true;
                        productSelect.disabled = true;
                        unitPriceField.value = '';
                        totalPriceField.value = '';

                        if (!animalId) return;

                        const feedTypes = [];

                        productOptions.forEach(product => {
                            if (product.dataset.animalId == animalId) {
                                const feedId = product.dataset.feedtypeId;
                                const feedName = product.dataset.feedtypeName;
                                const inStock = Number(product.dataset.quantity) > 0;

                                let feed = feedTypes.find(f => f.id == feedId);
                                if (!feed) {
                                    feed = { id: feedId, name: feedName, hasStock: inStock };
                                    feedTypes.push(feed);
                                } else if (inStock) {
                                    feed.hasStock = true;
                                }
                            }
                        });

                        feedTypes.forEach(feed => {
                            const option = document.createElement('option');
                            option.value = feed.id;
                            option.textContent = feed.hasStock ? feed.name : `${feed.name} — Out of Stock`;
                            if (!feed.hasStock) {
                                option.disabled = true;
                            }
                            feedTypeSelect.appendChild(option);
                        });

                        if (feedTypes.length > 0) {
                            feedTypeSelect.disabled = false;
                        }
                    });



                    // -------------------------
                    // Feed type changed
                    // -------------------------
                    feedTypeSelect.addEventListener('change', function () {
                        const feedTypeId = this.value;

                        productSelect.innerHTML = '<option value="">-- Select a package --</option>';
                        productSelect.disabled = true;
                        unitPriceField.value = '';
                        totalPriceField.value = '';

                        if (!feedTypeId) return;

                        productOptions.forEach(product => {
                            if (product.dataset.feedtypeId == feedTypeId) {
                                const inStock = Number(product.dataset.quantity) > 0;

                                const option = document.createElement('option');
                                option.value = product.value;
                                option.textContent = inStock
                                    ? product.dataset.label
                                    : `${product.dataset.label} — Out of Stock`;

                                // copy every data-* attribute (price, quantity, amount, measureName, measureAbbr, label, etc.)
                                Object.assign(option.dataset, product.dataset);

                                if (!inStock) {
                                    option.disabled = true;
                                }

                                productSelect.appendChild(option);
                            }
                        });

                        if (productSelect.options.length > 1) {
                            productSelect.disabled = false;
                        }
                    });

                    // -------------------------
                    // Price calculation
                    // -------------------------
                    function updatePrices() {
                        const selected = productSelect.options[productSelect.selectedIndex];

                        const price = Number(selected?.dataset.price || 0);              // price per package
                        const stockPackages = Number(selected?.dataset.quantity || 0);   // NUMBER OF PACKAGES in stock
                        const measureName = selected?.dataset.measureName || '';
                        const measureAbbr = selected?.dataset.measureAbbr || '';
                        const packageAmount = Number(selected?.dataset.amount || 0);     // physical size of ONE package

                        const quantity = Number(quantityInput.value || 0);               // number of PACKAGES ordered

                        unitPriceField.value = price.toFixed(2);
                        totalPriceField.value = (price * quantity).toFixed(2);

                        const totalPhysical = packageAmount * quantity;                  // informational only
                        document.getElementById('totalPhysicalHelper').textContent =
                            quantity > 0 ? `= ${totalPhysical.toFixed(2)}${measureAbbr} total` : '';

                        document.getElementById('unitPriceLabel').textContent =
                            selected && selected.value
                                ? `Price per ${packageAmount}${measureAbbr} ${measureName}`
                                : 'Unit Price';

                        document.getElementById('quantityLabel').textContent =
                            selected && selected.value ? 'Quantity (number of packages)' : 'Quantity';

                        const stockText = document.getElementById('stockAvailableText');
                        const errorText = document.getElementById('quantityError');
                        const submitBtn = document.getElementById('orderSubmitBtn');

                        if (selected && selected.value) {
                            quantityInput.max = stockPackages;
                            stockText.textContent = `${stockPackages} package(s) in stock`;

                            if (quantity > stockPackages) {
                                errorText.textContent = `Only ${stockPackages} package(s) available in stock.`;
                                errorText.style.display = 'block';
                                quantityInput.classList.add('is-invalid');
                                submitBtn.disabled = true;
                            } else {
                                errorText.style.display = 'none';
                                quantityInput.classList.remove('is-invalid');
                                submitBtn.disabled = false;
                            }
                        } else {
                            quantityInput.removeAttribute('max');
                            stockText.textContent = '';
                            errorText.style.display = 'none';
                            quantityInput.classList.remove('is-invalid');
                            submitBtn.disabled = false;
                        }
                    }


                    productSelect.addEventListener('change', updatePrices);

                    quantityInput.addEventListener('input', updatePrices);


                });
            </script>

            <!-- Modal footer -->
            <div class="modal-footer">
                <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
            </div>

        </div>
    </div>
</div>

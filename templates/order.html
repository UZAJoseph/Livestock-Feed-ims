<!-- ============================================= -->
<!-- Shared product data source (used by both modals) -->
<!-- ============================================= -->
<select id="products-data" style="display:none">
    {% for product in products %}
    <option value="{{ product.id }}" data-animal-id="{{ product.feed_type.animal.id }}"
        data-animal-name="{{ product.feed_type.animal.name }}" data-feedtype-id="{{ product.feed_type.id }}"
        data-feedtype-name="{{ product.feed_type.name }}" data-price="{{ product.default_price }}"
        data-quantity="{{ product.stock_quantity }}" data-amount="{{ product.amount }}"
        data-measure-name="{{ product.measure.name }}" data-measure-abbr="{{ product.measure.abbreviation }}"
        data-label="{{ product.store.name }} - {{ product.amount }}{{ product.measure.abbreviation }} - {{ product.default_price }} RWF">
    </option>
    {% endfor %}
</select>

<!-- ============================================= -->
<!-- ORDER NOW MODAL -->
<!-- ============================================= -->
<div class="modal glass-modal" id="orderNow">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">Order Now</h4>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                {% if messages %}
                {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                {% endfor %}
                {% endif %}

                <form method="post" action="{% url 'order_form' %}">
                    {% csrf_token %}
                    <input type="hidden" name="order_type" value="now">
                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label">Animal</label>
                            <select id="id_animal_now" class="form-select" required>
                                <option value="">-- Select an animal --</option>
                            </select>
                        </div>
                        <div class="col-6">
                            <label class="form-label">Feed Type</label>
                            <select id="id_feed_type_now" class="form-select" required>
                                <option value="">-- Select feed type --</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Package</label>
                        <select name="product" id="id_product_now" class="form-select" required disabled>
                            <option value="">-- Select a package --</option>
                        </select>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label" id="unitPriceLabel_now">Unit Price</label>
                            <input type="text" id="id_unit_price_now" class="form-control" readonly>
                        </div>
                        <div class="col-6">
                            <label class="form-label" id="quantityLabel_now">Quantity</label>
                            <input type="number" step="0.01" min="0.01" name="quantity" id="id_quantity_now"
                                class="form-control" required>
                            <div class="form-text text-white-50" id="totalPhysicalHelper_now"></div>
                            <div id="stockAvailableText_now" class="form-text" style="color: rgba(255,255,255,0.6);">
                            </div>
                            <div id="quantityError_now" class="form-text" style="display:none; color:#ff8a80;"></div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Total Price</label>
                        <input type="text" id="id_total_price_now" class="form-control" readonly>
                    </div>

                    <hr>
                    <p class="mb-2 text-center" style="color: rgba(255,255,255,0.6); font-size: 0.85rem;">
                        My Personal Information
                    </p>

                    <div class="row g-2 mb-2">
                        <div class="col-6">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" readonly
                                value="{{ request.user.first_name }} {{ request.user.last_name }}">
                        </div>
                        <div class="col-6">
                            <label class="form-label">Telephone</label>
                            <input type="text" class="form-control" readonly value="{{ profile.telephone|default:'' }}">
                        </div>
                    </div>

                    <div class="row g-2 mb-2">
                        <div class="col-6">
                            <label class="form-label">District</label>
                            <input type="text" class="form-control" readonly value="{{ profile.district|default:'' }}">
                        </div>
                        <div class="col-6">
                            <label class="form-label">Sector</label>
                            <input type="text" class="form-control" readonly value="{{ profile.sector|default:'' }}">
                        </div>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label">Cell</label>
                            <input type="text" class="form-control" readonly value="{{ profile.cell|default:'' }}">
                        </div>
                        <div class="col-6">
                            <label class="form-label">Village</label>
                            <input type="text" class="form-control" readonly value="{{ profile.village|default:'' }}">
                        </div>
                    </div>

                    <button type="submit" id="orderSubmitBtn_now" class="btn btn-success">Order Now</button>
                </form>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<style>
    .glass-modal .form-select option:disabled {
        color: rgba(255, 120, 120, 0.65);
        font-style: italic;
    }

    .glass-modal .modal-content {
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: white;
        border-radius: 12px;
    }

    .glass-modal .modal-header,
    .glass-modal .modal-footer {
        border-color: rgba(255, 255, 255, 0.2);
    }

    .glass-modal .form-control,
    .glass-modal .form-select {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: white;
    }

    .glass-modal .form-select option {
        background-color: #2c3e50;
        color: white;
    }

    .glass-modal .form-control::placeholder {
        color: rgba(255, 255, 255, 0.6);
    }

    .glass-modal .form-control:focus,
    .glass-modal .form-select:focus {
        background: rgba(255, 255, 255, 0.15);
        border-color: rgba(255, 255, 255, 0.5);
        color: white;
        box-shadow: none;
    }

    .glass-modal .form-control[readonly] {
        background: rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.85);
    }

    .glass-modal .form-control:disabled,
    .glass-modal .form-select:disabled {
        background: rgba(255, 255, 255, 0.05);
        color: rgba(255, 255, 255, 0.5);
    }

    .glass-modal .form-label {
        color: white;
    }

    .glass-modal .btn-close {
        filter: invert(1);
    }

    .glass-modal .alert {
        background: rgba(255, 255, 255, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: white;
    }

    .modal-backdrop.show {
        opacity: 0.6;
    }
</style>

<script>
    function openOrderModal(animalId, modalId = 'orderNow', suffix = 'now') {
        const modalEl = document.getElementById(modalId);
        const modal = new bootstrap.Modal(modalEl);

        modalEl.addEventListener('shown.bs.modal', function handler() {
            const animalSelect = document.getElementById(`id_animal_${suffix}`);
            animalSelect.value = animalId;
            animalSelect.dispatchEvent(new Event('change'));
            modalEl.removeEventListener('shown.bs.modal', handler);
        });

        modal.show();
    }

    ['orderNow', 'bookNow'].forEach(modalId => {
        const modalEl = document.getElementById(modalId);
        modalEl.addEventListener('hide.bs.modal', function () {
            if (document.activeElement && this.contains(document.activeElement)) {
                document.activeElement.blur();
            }
        });
    });

    document.addEventListener('DOMContentLoaded', function () {

        const dataSelect = document.getElementById('products-data');
        const productOptions = Array.from(dataSelect.options);

        // -------------------------------------------------
        // Shared setup, reused for both "now" and "book" modals
        // enforceStock: if true, blocks submit when qty > stock
        // -------------------------------------------------
        function setupOrderModal(suffix, enforceStock) {
            const animalSelect = document.getElementById(`id_animal_${suffix}`);
            const feedTypeSelect = document.getElementById(`id_feed_type_${suffix}`);
            const productSelect = document.getElementById(`id_product_${suffix}`);
            const quantityInput = document.getElementById(`id_quantity_${suffix}`);
            const unitPriceField = document.getElementById(`id_unit_price_${suffix}`);
            const totalPriceField = document.getElementById(`id_total_price_${suffix}`);
            const unitPriceLabel = document.getElementById(`unitPriceLabel_${suffix}`);
            const quantityLabel = document.getElementById(`quantityLabel_${suffix}`);
            const totalPhysicalHelper = document.getElementById(`totalPhysicalHelper_${suffix}`);
            const stockText = document.getElementById(`stockAvailableText_${suffix}`);
            const errorText = document.getElementById(`quantityError_${suffix}`);
            const submitBtn = document.getElementById(`orderSubmitBtn_${suffix}`);

            // -------------------------
            // Load animals
            // -------------------------
            const animals = [];
            productOptions.forEach(product => {
                const animalId = product.dataset.animalId;
                const animalName = product.dataset.animalName;
                if (!animals.find(a => a.id === animalId)) {
                    animals.push({ id: animalId, name: animalName });
                }
            });
            animals.forEach(animal => {
                const option = document.createElement('option');
                option.value = animal.id;
                option.textContent = animal.name;
                animalSelect.appendChild(option);
            });

            // -------------------------
            // Animal changed
            // -------------------------
            animalSelect.addEventListener('change', function () {
                const animalId = this.value;

                feedTypeSelect.innerHTML = '<option value="">-- Select feed type --</option>';
                productSelect.innerHTML = '<option value="">-- Select a package --</option>';
                feedTypeSelect.disabled = true;
                productSelect.disabled = true;
                unitPriceField.value = '';
                totalPriceField.value = '';

                if (!animalId) return;

                const feedTypes = [];
                productOptions.forEach(product => {
                    if (product.dataset.animalId == animalId) {
                        const feedId = product.dataset.feedtypeId;
                        const feedName = product.dataset.feedtypeName;
                        // Book Now doesn't care about stock when listing feed types
                        const inStock = enforceStock ? Number(product.dataset.quantity) > 0 : true;

                        let feed = feedTypes.find(f => f.id == feedId);
                        if (!feed) {
                            feed = { id: feedId, name: feedName, hasStock: inStock };
                            feedTypes.push(feed);
                        } else if (inStock) {
                            feed.hasStock = true;
                        }
                    }
                });

                feedTypes.forEach(feed => {
                    const option = document.createElement('option');
                    option.value = feed.id;
                    option.textContent = (enforceStock && !feed.hasStock) ? `${feed.name} — Out of Stock` : feed.name;
                    if (enforceStock && !feed.hasStock) option.disabled = true;
                    feedTypeSelect.appendChild(option);
                });

                if (feedTypes.length > 0) feedTypeSelect.disabled = false;
            });

            // -------------------------
            // Feed type changed
            // -------------------------
            feedTypeSelect.addEventListener('change', function () {
                const feedTypeId = this.value;

                productSelect.innerHTML = '<option value="">-- Select a package --</option>';
                productSelect.disabled = true;
                unitPriceField.value = '';
                totalPriceField.value = '';

                if (!feedTypeId) return;

                productOptions.forEach(product => {
                    if (product.dataset.feedtypeId == feedTypeId) {
                        const inStock = enforceStock ? Number(product.dataset.quantity) > 0 : true;

                        const option = document.createElement('option');
                        option.value = product.value;
                        option.textContent = (enforceStock && !inStock)
                            ? `${product.dataset.label} — Out of Stock`
                            : product.dataset.label;

                        Object.assign(option.dataset, product.dataset);

                        if (enforceStock && !inStock) option.disabled = true;

                        productSelect.appendChild(option);
                    }
                });

                if (productSelect.options.length > 1) productSelect.disabled = false;
            });

            // -------------------------
            // Price calculation
            // -------------------------
            function updatePrices() {
                const selected = productSelect.options[productSelect.selectedIndex];

                const price = Number(selected?.dataset.price || 0);
                const stockPackages = Number(selected?.dataset.quantity || 0);
                const measureName = selected?.dataset.measureName || '';
                const measureAbbr = selected?.dataset.measureAbbr || '';
                const packageAmount = Number(selected?.dataset.amount || 0);
                const quantity = Number(quantityInput.value || 0);

                unitPriceField.value = price.toFixed(2);
                totalPriceField.value = (price * quantity).toFixed(2);

                const totalPhysical = packageAmount * quantity;
                totalPhysicalHelper.textContent =
                    quantity > 0 ? `= ${totalPhysical.toFixed(2)}${measureAbbr} total` : '';

                unitPriceLabel.textContent = selected && selected.value
                    ? `Price per ${packageAmount}${measureAbbr} ${measureName}`
                    : 'Unit Price';

                quantityLabel.textContent = selected && selected.value
                    ? 'Quantity (number of packages)'
                    : 'Quantity';

                if (selected && selected.value) {
                    // Book Now: show stock as reference only, never block or cap
                    stockText.textContent = enforceStock
                        ? `${stockPackages} package(s) in stock`
                        : `${stockPackages} package(s) currently in stock (for reference — booking isn't limited by current stock)`;

                    if (enforceStock) {
                        quantityInput.max = stockPackages;
                        if (quantity > stockPackages) {
                            errorText.textContent = `Only ${stockPackages} package(s) available in stock.`;
                            errorText.style.display = 'block';
                            quantityInput.classList.add('is-invalid');
                            submitBtn.disabled = true;
                        } else {
                            errorText.style.display = 'none';
                            quantityInput.classList.remove('is-invalid');
                            submitBtn.disabled = false;
                        }
                    } else {
                        quantityInput.removeAttribute('max');
                        errorText.style.display = 'none';
                        quantityInput.classList.remove('is-invalid');
                        submitBtn.disabled = false;
                    }
                } else {
                    quantityInput.removeAttribute('max');
                    stockText.textContent = '';
                    errorText.style.display = 'none';
                    quantityInput.classList.remove('is-invalid');
                    submitBtn.disabled = false;
                }
            }

            productSelect.addEventListener('change', updatePrices);
            quantityInput.addEventListener('input', updatePrices);
        }

        setupOrderModal('now', true);
        setupOrderModal('book', false);

        // -------------------------
        // Book Now: date field min/max (5–21 days out)
        // -------------------------
        const dateInput = document.getElementById('id_requested_date');
        const bookingWindowText = document.getElementById('bookingWindowText');
        if (dateInput) {
            const today = new Date();
            const earliest = new Date(today);
            earliest.setDate(today.getDate() + 5);
            const latest = new Date(today);
            latest.setDate(today.getDate() + 21);

            const fmt = d => d.toISOString().split('T')[0];
            dateInput.min = fmt(earliest);
            dateInput.max = fmt(latest);

            const display = d => d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
            bookingWindowText.textContent = `Choose a date between ${display(earliest)} and ${display(latest)}.`;
        }
    });
</script>
